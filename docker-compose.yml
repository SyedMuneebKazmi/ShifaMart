# ─────────────────────────────────────────────────────────────────────────────
# ShifaMart+ – Docker Compose
#
# Usage (local):
#   cp .env.example .env      # fill in real values
#   docker compose up --build
#
# Usage (Coolify):
#   Point each service at its own Dockerfile.
#   Set environment variables in the Coolify dashboard.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── 1. Node.js / Express Backend ──────────────────────────────────────────
  backend:
    build:
      context: ./fyp_shifamart_backend
      dockerfile: Dockerfile
    container_name: shifamart_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      # Container reads MONGODB_URI; host .env may use MongoDB_URI (Compose default) or MONGODB_URI
      MONGODB_URI: ${MONGODB_URI:-${MongoDB_URI}}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE: ${JWT_EXPIRE:-7d}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRE: ${JWT_REFRESH_EXPIRE:-30d}
      PYTHON_API_URL: http://ai_agent:8000
      FRONTEND_URL: ${FRONTEND_URL}
      # Email (optional – leave blank to use console-log fallback)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
    volumes:
      # Persist uploaded files (avatars, etc.)
      - backend_uploads:/app/uploads
    ports:
      - "5000:5000"
    networks:
      - shifamart_net
    depends_on:
      ai_agent:
        condition: service_healthy

  # ── 2. Python / FastAPI AI Agent ──────────────────────────────────────────
  ai_agent:
    build:
      context: ./fyp_shifamart_ai_agent
      dockerfile: Dockerfile
    container_name: shifamart_ai
    restart: unless-stopped
    environment:
      PORT: 8000
    volumes:
      # Persist / swap trained weights (CSVs are baked into the image from fyp_shifamart_ai_agent/)
      - ./fyp_shifamart_ai_agent/models:/app/models
    ports:
      - "8000:8000"
    networks:
      - shifamart_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/api/health"]
      interval: 60s
      timeout: 10s
      start_period: 120s   # models take time to load
      retries: 3

  # ── 3. React / Vite Frontend (Nginx) ──────────────────────────────────────
  frontend:
    build:
      context: ./fyp_shifamart_frontend
      dockerfile: Dockerfile
      args:
        # The frontend JS bundle talks to the backend via this URL.
        # In production set this to https://api.yourdomain.com
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    container_name: shifamart_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - shifamart_net
    depends_on:
      - backend

# ─── Named volumes ────────────────────────────────────────────────────────────
volumes:
  backend_uploads:

# ─── Shared network ───────────────────────────────────────────────────────────
networks:
  shifamart_net:
    driver: bridge
